<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="預金">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#F1F0EC">
<title>預金の予報</title>
<style>
:root{
  --bg:#F1F0EC; --card:#FCFCFB; --line:#E3E1DA; --ink:#111; --ink2:#5A5852; --ink3:#8A8984;
  --green:#0F5132; --green-bg:#E6F0EA; --red:#B3261E; --red-bg:#FFF3F0; --red-line:#F3CFC8;
  --done:#E3E1DA; --fix:#D8E8FF; --fix-ink:#174A9C; --est:#FDE9C8; --est-ink:#8A5200;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:20px}.top .sync{font-size:12px;color:var(--ink3)}
.icon{background:none;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;color:var(--ink)}
.cap{font-size:14px;color:var(--ink2)}
.hero{background:var(--green);color:#fff;border-radius:20px;padding:20px}
.hero .cap{color:#CFE6DA}.hero.bad{background:var(--red)}.hero.bad .cap{color:#FAD9D4}
.big{font-size:60px;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:700}
.big small,.v small{font-size:20px;font-weight:400;margin-left:4px}
.hero .note{font-size:13px;margin-top:6px;opacity:.9}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.tile .v{font-size:40px;margin-top:2px}
.tile.warn{background:var(--red-bg);border-color:var(--red-line)}
.bar{height:10px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.bar.bad i{background:var(--red)}
.mv{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-size:18px}
.minus{color:var(--red)}.plus{color:var(--green)}
.toggle{display:block;width:100%;background:none;border:none;color:var(--ink2);font-size:14px;padding:16px 0 8px}
.it{display:flex;align-items:center;gap:6px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:16px}
.it .d{width:44px;color:var(--ink2);font-size:14px}.it .n{flex:1}.it .a{text-align:right;min-width:78px}
.it .b{text-align:right;min-width:64px;color:var(--ink2);font-size:14px}
.it.low{background:var(--red-bg)}.it.past{opacity:.55}
.tag{font-size:11px;border-radius:8px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.t-done{background:var(--done);color:#555}.t-fix{background:var(--fix);color:var(--fix-ink)}.t-est{background:var(--est);color:var(--est-ink)}.t-wait{background:#fff;border:1px solid var(--est-ink);color:var(--est-ink)}
.chk{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:3px 6px;color:var(--ink2)}
.add{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;
  background:#111;color:#fff;border:none;border-radius:16px;padding:16px;font-size:17px}
.prompt{background:var(--est);color:var(--est-ink);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:15px}
.prompt input{width:100%;margin-top:8px}
dialog{border:none;border-radius:20px;padding:20px;width:min(92vw,480px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-size:18px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
input,select{width:100%;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:12px;border-radius:12px;font-size:16px;border:1px solid var(--line);background:#fff}
.btns .ok{background:#111;color:#fff;border-color:#111}
.tpl{display:grid;grid-template-columns:1.4fr .7fr 1.2fr .5fr;gap:6px;align-items:center;margin-top:6px}
.tpl input{padding:8px;font-size:15px}.small{font-size:12px;color:var(--ink3);margin-top:6px}
.sec{font-size:14px;font-weight:700;margin-top:18px}
input[type=range]{width:100%;padding:0;margin-top:10px;accent-color:var(--green)}
.rg{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2)}.rg b{font-size:16px;color:var(--ink)}
details{margin-top:8px}summary{font-size:14px;color:var(--ink2);cursor:pointer;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}summary::after{content:" ▼";font-size:11px}details[open] summary::after{content:" ▲"}
.dr{display:flex;justify-content:space-between;gap:8px;padding:8px 0 4px;font-size:14px;border-top:1px solid var(--line)}
.dr.tot{font-weight:700;font-size:15px}.ds{color:var(--ink2);font-size:12.5px;line-height:1.6;padding:0 0 6px}
</style>
</head>
<body>

<div class="top"><div><h1 id="ttl">今月</h1><div class="sync" id="sync"></div></div>
  <button class="icon" id="btn-set" aria-label="設定">⚙ 設定</button></div>

<div class="prompt" id="ask-start" hidden>
  <div><b id="ask-month"></b>月初（1日）の口座残高を入れてください</div>
  <input type="number" inputmode="numeric" id="in-start" placeholder="例：700000">
</div>

<div class="hero" id="hero"><div class="cap">今すぐ貯金に回せる</div>
  <div class="big" id="avail">—<small>万円</small></div><div class="note" id="avail-note"></div></div>

<div class="tile"><div class="cap">今月末に残りそう</div>
  <div class="v num" id="end">—<small>万円</small></div>
  <div class="bar" id="end-bar"><i id="end-fill" style="width:0"></i></div>
  <div class="cap" id="end-note" style="margin-top:6px"></div></div>

<div class="tile"><div class="cap">来月末に残りそう（ざっくり）</div>
  <div class="v num" id="next">—<small>万円</small></div>
  <details id="next-det"><summary id="next-sum">内訳とカードの支出</summary><div id="next-note"></div></details></div>

<div class="tile" id="save-tile"><div class="cap">貯金の目安（Zaimの「貯金」に入れる額）</div>
  <div class="v num" id="save-amt">—<small>円</small></div>
  <div class="cap" id="save-why" style="margin-top:6px;font-size:13px;line-height:1.7"></div>
  <div id="cap-box" hidden>
    <div class="cap" style="margin-top:14px">今月のカード利用を抑える（月末までの合計）</div>
    <input type="range" id="cap-range" step="10000">
    <div class="rg"><span id="cap-lo"></span><b id="cap-now"></b><span id="cap-hi"></span></div>
    <div class="cap" id="cap-note" style="font-size:13px;margin-top:4px"></div>
    <button class="chk" id="cap-reset" style="margin-top:8px">ペースのままに戻す</button>
  </div></div>

<div class="tile warn" id="big-tile"><div class="cap">次に大きく動く日</div>
  <div class="mv"><span id="big-name"></span><span class="num" id="big-amt"></span></div>
  <div class="cap" id="big-note" style="margin-top:4px"></div></div>

<button class="toggle" id="btn-flow">▼ 今月の流れを見る</button>
<div id="flow" hidden></div>

<button class="add" id="btn-add">＋ 支出メモ・予定を追加</button>

<!-- 追加 -->
<dialog id="dlg-add"><h2>支出メモ・予定を追加</h2>
  <label>種類</label>
  <select id="a-kind">
    <option value="card">カードで使った（来月の引き落としに足す）</option>
    <option value="out">口座から出る（今月）</option>
    <option value="in">口座に入る（今月）</option>
  </select>
  <label>名前</label><input id="a-name" placeholder="例：服、旅行の予約">
  <div class="row"><div><label>日</label><input type="number" inputmode="numeric" id="a-day" min="1" max="31"></div>
    <div><label>金額（円）</label><input type="number" inputmode="numeric" id="a-amt"></div></div>
  <div class="btns"><button id="a-cancel">やめる</button><button class="ok" id="a-ok">追加</button></div>
</dialog>

<!-- 金額の修正 -->
<dialog id="dlg-edit"><h2 id="e-ttl"></h2>
  <div class="row"><div><label>日</label><input type="number" inputmode="numeric" id="e-day" min="1" max="31"></div>
    <div><label>金額（円・出るお金はマイナス）</label><input type="number" inputmode="numeric" id="e-amt"></div></div>
  <label>状態</label><select id="e-st"><option value="est">見込み</option><option value="fix">確定</option><option value="done">済（実際に動いた）</option></select>
  <div class="btns"><button id="e-del">削除</button><button id="e-cancel">やめる</button><button class="ok" id="e-ok">保存</button></div>
</dialog>

<!-- 設定 -->
<dialog id="dlg-set"><h2>設定</h2>
  <label>残したい額（円）</label><input type="number" inputmode="numeric" id="s-target">
  <label>今月の月初残高（円）</label><input type="number" inputmode="numeric" id="s-start">
  <label>今日の残高（円）　口座を見て入れると、ここから先を計算し直します</label><input type="number" inputmode="numeric" id="s-bal" placeholder="空欄＝月初の残高から計算">
  <div class="small" id="s-bal-note"></div>
  <div class="sec">毎月の予定（翌月に自動でコピー）</div>
  <div class="tpl cap"><span>名前</span><span>日</span><span>金額（出るのは−）</span><span>不確実</span></div>
  <div id="s-tpl"></div>
  <div class="small">「不確実」に✓した入金（精算など）は、実際に入るまで「今すぐ貯金に回せる額」に入れません。</div>
  <div class="sec">メールから自動で取り込む（任意）</div>
  <label>GAS WebアプリのURL</label><input type="url" id="s-gas" placeholder="https://script.google.com/macros/s/.../exec">
  <label>合言葉（GASに設定したもの）</label><input id="s-token" autocomplete="off">
  <div class="btns"><button id="s-sync">今すぐ取り込む</button><button id="s-backup">バックアップをコピー</button></div>
  <div class="btns"><button id="s-cancel">閉じる</button><button class="ok" id="s-ok">保存</button></div>
</dialog>

<script>
(function(){
"use strict";
/* ---------- 保存（端末の中だけ） ---------- */
var KEY="yokin_v1";
var store=(function(){var mem={},ok=false;try{localStorage.setItem("__t","1");localStorage.removeItem("__t");ok=true;}catch(e){}
  return{get:function(k){try{if(ok)return localStorage.getItem(k);}catch(e){}return mem[k]||null;},
         set:function(k,v){try{if(ok){localStorage.setItem(k,v);return;}}catch(e){}mem[k]=v;}};})();
function $(id){return document.getElementById(id);}
function man(y){return (Math.round(y/1000)/10).toFixed(1);}          // 円→万（小数1）
function m0(y){return String(+man(y));}             // 50.0→50
function sman(y){return (y<0?"−":"+")+man(Math.abs(y))+"万";}
function pad(n){return(n<10?"0":"")+n;}
function ymOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function addYm(ym,k){var p=ym.split("-"),d=new Date(+p[0],+p[1]-1+k,1);return ymOf(d);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* 毎月の予定のひな型（key は自動取り込みの照合に使う） */
var DEFAULT_TPL=[
  {key:"seisan",name:"精算（妻）",day:2, amt:114000, unsure:true},
  {key:"rent",  name:"家賃",       day:10,amt:-115000},
  {key:"salary",name:"給料",       day:15,amt:320000, adj:[{from:"2027-02",delta:-30000}]},
  {key:"ideco", name:"iDeCo",      day:26,amt:-23000, until:"2027-01"},
  {key:"card2", name:"カード②",    day:26,amt:-12000},
  {key:"card1", name:"カード①",    day:27,amt:-240000}
];
/* メールの入出金を予定に当てはめるルール（日の幅・金額の幅） */
var MATCH={seisan:{d:[1,11],min:30000,max:200000,dir:1},rent:{d:[8,12],min:100000,max:130000,dir:-1},
  salary:{d:[12,16],min:280000,max:360000,dir:1},ideco:{d:[24,29],min:22000,max:24000,dir:-1},card2:{d:[25,29],min:1,max:100000,dir:-1},card1:{d:[26,30],min:1,max:9e9,dir:-1}};

var SYNC_ERR="";
var S={target:500000,tpl:DEFAULT_TPL,months:{},gas:"",token:"",feed:null,feedAt:null,used:{}};
try{var raw=store.get(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){store.set(KEY,JSON.stringify(S));}

var NOW=new Date(), YM=ymOf(NOW), TODAY=NOW.getDate();

/* ---------- 月のデータ ---------- */
function usageOf(card,ym){var u=S.feed&&S.feed.usage&&S.feed.usage[card];return u&&u[ym]!=null?u[ym]:null;}
function dim(ym){var p=ym.split("-");return new Date(+p[0],+p[1],0).getDate();}
function sum(a){return a.reduce(function(s,x){return s+x;},0);}
function inRule(key,mv){var r=MATCH[key];if(!r||r.dir!==mv.dir)return false;var d=+mv.date.slice(8,10);
  return d>=r.d[0]&&d<=r.d[1]&&mv.amount>=r.min&&mv.amount<=r.max;}
/* 精算：直近3回の入金の平均／給料：いちばん新しい入金（どちらも、その月より前の実績から） */
function histInfo(key,ym){var f=S.feed;if(!f||!f.moves)return null;
  var a=f.moves.filter(function(mv){return mv.date.slice(0,7)<ym&&inRule(key,mv);}).sort(function(x,y){return x.date<y.date?1:-1;});
  if(!a.length)return null;var last=a[0].date.slice(0,7);
  if(key==="salary")return{amt:a[0].amount,last:last};
  var n=a.slice(0,3);return{amt:Math.round(sum(n.map(function(x){return x.amount;}))/n.length/1000)*1000,last:last};}
function usageComplete(ym){var sn=S.feed&&S.feed.since;return !sn||ym>sn.slice(0,7);}
function histUsage(card,beforeYm){var u=S.feed&&S.feed.usage&&S.feed.usage[card];if(!u)return[];
  return Object.keys(u).filter(function(k){return k<beforeYm&&usageComplete(k);}).sort().slice(-6).map(function(k){return u[k];});}
/* カードのその月の利用額の予測。月の途中は「ここまでのペース」と「過去6か月の平均」を、日がたつほどペース寄りに混ぜる */
function projUsage(card,ym){
  var done=usageOf(card,ym),h=histUsage(card,ym),avg=h.length?Math.round(sum(h)/h.length):null,n=h.length;
  if(ym<YM){return(done==null||!usageComplete(ym))?null:{est:done,low:done,high:done,done:done,avg:avg,n:n};}
  if(done==null&&avg==null)return null;
  if(ym>YM)return{est:avg,low:avg,high:avg,done:0,avg:avg,n:n};
  done=done||0;
  var el=Math.max(1,TODAY-1),d=dim(ym),pace=Math.round(done/el*d),w=Math.min(1,el/d);
  var est=avg==null?pace:Math.round(w*pace+(1-w)*avg);
  var lo=Math.min(pace,avg==null?pace:avg),hi=Math.max(pace,avg==null?pace:avg);
  return{est:Math.max(done,est),low:Math.max(done,lo),high:Math.max(done,hi),done:done,avg:avg,n:n};}
function cardMemos(ym){var m=S.months[ym];return m?m.memos.filter(function(x){return x.kind==="card";}).reduce(function(s,x){return s+x.amt;},0):0;}
/* カードの見込み額：先月の利用額（メール）があればそれ、なければひな型＋先月のカードメモ */
function cardEst(t,ym){var prev=addYm(ym,-1),p=projUsage(t.key,prev);
  if(p&&p.est!=null)return -p.est; return t.amt-(t.key==="card1"?cardMemos(prev):0);}
function tplAmt(t,ym){if(t.until&&ym>t.until)return null;if(t.from&&ym<t.from)return null;
  var a,last=null;
  if(t.key==="card1"||t.key==="card2")a=cardEst(t,ym);
  else{a=t.amt;if(t.key==="seisan"||t.key==="salary"){var h=histInfo(t.key,ym);if(h){a=h.amt;last=h.last;}}}
  /* 補正（DC開始など）は、その月より前の実績にだけ足す。実績がすでに補正後なら足さない */
  (t.adj||[]).forEach(function(x){if(ym>=x.from&&(last==null||last<x.from))a+=x.delta;});return a;}
function ensure(ym){
  if(S.months[ym])return S.months[ym];
  var m={start:null,items:S.tpl.filter(function(t){return tplAmt(t,ym)!=null;}).map(function(t){return{id:uid(),key:t.key,name:t.name,day:t.day,
    amt:tplAmt(t,ym),st:"est",unsure:!!t.unsure};}),memos:[]};
  S.months[ym]=m;return m;}

/* 今月の入出金を日付順に（口座が動くものだけ） */
function events(ym){var m=ensure(ym);
  var ev=m.items.map(function(i){return{ref:i,type:"item",day:i.day,name:i.name,amt:i.amt,st:i.st,unsure:i.unsure};});
  m.memos.forEach(function(x){if(x.kind!=="card")ev.push({ref:x,type:"memo",day:x.day,name:x.name,amt:x.kind==="in"?x.amt:-x.amt,st:"fix",unsure:false});});
  return ev.sort(function(a,b){return a.day-b.day||b.amt-a.amt;});}
function startOf(ym){var m=ensure(ym);if(m.start!=null)return m.start;
  var p=S.months[addYm(ym,-1)];return p?calc(addYm(ym,-1)).end:null;}

function calc(ym){
  var ev=events(ym),start=startOf(ym),cur=ym===YM,today=cur?TODAY:0,m=S.months[ym],an=cur&&m.anchor?m.anchor:null;
  if(start==null&&!an)return{ev:ev,start:null};
  var after=an?an.day:0,base=an?an.bal:start;      /* 今日の残高を入れたら、その日より後の動きだけを足す */
  var run=start,end=base,safe=base,pending=0,lowDay=null,low=Infinity;
  ev.forEach(function(e){
    if(e.day<=after){if(run!=null){run+=e.amt;e.after=run;}else e.after=null;}
    else{end+=e.amt;e.after=end;}});
  var live=ev.filter(function(e){return e.day>after;});
  /* 今日まで：起きたとみなす（不確実な入金は「済」になるまで数えない） */
  live.forEach(function(e){if(e.day<=today){if(e.unsure&&e.st!=="done"&&e.amt>0){pending+=e.amt;return;}safe+=e.amt;}});
  var minSafe=safe;
  live.forEach(function(e){if(e.day>today){if(e.unsure&&e.st!=="done"&&e.amt>0){pending+=e.amt;return;}safe+=e.amt;}
    if(e.day>today&&safe<minSafe)minSafe=safe;});
  live.forEach(function(e){if(e.day>=today&&e.after<low){low=e.after;lowDay=e;}});
  return{ev:ev,start:start!=null?start:base,end:end,minSafe:minSafe,pending:pending,low:lowDay,an:an};}

function nextEnd(cap){var c=calc(YM);if(c.start==null)return null;var n=addYm(YM,1),tot=0,up=0,dn=0,parts=[],sumEst=0,sumDone=0;
  var P={card1:projUsage("card1",YM),card2:projUsage("card2",YM)};
  ["card1","card2"].forEach(function(k){if(P[k]&&P[k].est!=null){sumEst+=P[k].est;sumDone+=P[k].done;}});
  var f=(cap!=null&&sumEst>0)?cap/sumEst:1;      /* カード利用を cap に抑えるなら、各カードをその割合で */
  S.tpl.forEach(function(t){var a=tplAmt(t,n);if(a==null)return;
    if(t.key==="card1"||t.key==="card2"){var p=P[t.key];
      if(p&&p.est!=null&&a===-p.est){up+=p.est-p.low;dn+=p.high-p.est;a=-Math.max(p.done,Math.round(p.est*f));}}
    tot+=a;parts.push({key:t.key,name:t.name,amt:a});});
  var nm=S.months[n];if(nm)nm.memos.forEach(function(x){if(x.kind!=="card"){var v=x.kind==="in"?x.amt:-x.amt;tot+=v;parts.push({key:"memo",name:x.name,amt:v});}});
  var est=c.end+tot;return{est:est,lo:est-dn,hi:est+up,base:est-dn/2,end:c.end,parts:parts,cardEst:sumEst,cardDone:sumDone};}
/* 貯金の目安：今月の安全分と、来月末（やや悪い側）の安全分の、少ないほう */
function advice(cap){var c=calc(YM);if(c.start==null)return null;var nx=nextEnd(cap);if(!nx)return null;
  var now=c.minSafe-S.target,next=nx.base-S.target;
  return{now:now,next:next,amt:Math.max(0,Math.floor(Math.min(now,next)/1000)*1000),nx:nx,c:c};}

/* ---------- メールからの取り込み（GAS） ---------- */
function applyFeed(){var f=S.feed;if(!f)return;
  Object.keys(S.months).forEach(function(ym){var m=S.months[ym];
    if(ym>=YM)m.items.forEach(function(i){if(i.st==="est"&&!i.manual&&(i.key==="seisan"||i.key==="salary"||i.key==="card1"||i.key==="card2")){
      var t=S.tpl.filter(function(x){return x.key===i.key;})[0],a=t&&tplAmt(t,ym);if(a!=null)i.amt=a;}});
    (f.bills||[]).forEach(function(b){if(b.due.slice(0,7)!==ym)return;
      m.items.forEach(function(i){if(i.key===b.card&&i.st!=="done"){i.amt=-b.amount;i.day=+b.due.slice(8,10);i.st="fix";}});});
    (f.moves||[]).forEach(function(mv){if(S.used[mv.id]||mv.date.slice(0,7)!==ym)return;var d=+mv.date.slice(8,10);
      var hit=m.items.filter(function(i){var r=MATCH[i.key];if(!r||i.st==="done"||r.dir!==mv.dir||d<r.d[0]||d>r.d[1]||mv.amount<r.min||mv.amount>r.max)return false;
        if(i.st==="fix"&&(i.key==="card1"||i.key==="card2"))return mv.amount===-i.amt;return true;})[0];
      if(hit){hit.amt=mv.dir*mv.amount;hit.day=d;hit.st="done";S.used[mv.id]=1;}});});
  save();}
function unmatched(){var f=S.feed;if(!f)return[];return(f.moves||[]).filter(function(mv){return !S.used[mv.id]&&mv.date.slice(0,7)===YM;});}
function sync(){if(!S.gas){$("sync").textContent="";return;}
  $("sync").textContent="メールから取り込み中…";
  fetch(S.gas+(S.gas.indexOf("?")<0?"?":"&")+"token="+encodeURIComponent(S.token||""))
    .then(function(r){return r.json();}).then(function(j){if(j.error)throw new Error(j.error);
      SYNC_ERR="";S.feed=j;S.feedAt=new Date().toISOString();applyFeed();render();})
    .catch(function(e){SYNC_ERR="メールの取り込みに失敗："+e.message;$("sync").textContent=SYNC_ERR;});}

/* ---------- 画面 ---------- */
function tag(e){
  var an=S.months[YM]&&S.months[YM].anchor;
  if(an&&e.day<=an.day&&e.st!=="done")return '<span class="tag t-done">残高に反映</span>';
  if(e.st==="done")return '<span class="tag t-done">済</span>';
  if(e.st==="fix")return '<span class="tag t-fix">確定</span>';
  if(e.day<TODAY)return '<span class="tag t-wait">'+(e.unsure&&e.amt>0?'入金待ち':'未確認')+'</span>';  /* 日付は過ぎたが、メールでまだ確認できていない */
  return '<span class="tag t-est">見込み</span>';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function yen(n){return Math.round(n).toLocaleString("ja-JP");}
function renderSave(mcap){
  var ad=advice(mcap!=null?mcap:null),box=$("cap-box");if(!ad){$("save-tile").hidden=true;return;}$("save-tile").hidden=false;
  var nx=ad.nx,pace=nx.cardEst,done=nx.cardDone,lo=Math.ceil(done/10000)*10000,hi=Math.max(lo+10000,Math.round(pace*1.5/10000)*10000);
  $("save-amt").innerHTML=yen(ad.amt)+"<small>円</small>";
  $("save-why").innerHTML=(ad.amt>0?"この額までなら、今月も来月末も、残したい額 "+m0(S.target)+"万を守れます。":"今は貯金に回せません。")
    +"<br>今月の安全分 "+(ad.now<0?"−":"")+man(Math.abs(ad.now))+"万／来月末（やや悪い側 "+man(nx.base)+"万）の安全分 "+(ad.next<0?"−":"")+man(Math.abs(ad.next))+"万 のうち、少ないほう";
  box.hidden=!(pace>0);
  if(pace>0){var r=$("cap-range"),v=mcap!=null?mcap:pace;v=Math.max(lo,Math.min(hi,v));
    r.min=lo;r.max=hi;r.value=v;
    $("cap-lo").textContent=man(lo)+"万（いま使った額）";$("cap-hi").textContent=man(hi)+"万";
    $("cap-now").textContent=man(v)+"万に抑える";
    var d=pace-v;
    $("cap-note").textContent="いまのペースだと 約"+man(pace)+"万"+(mcap==null||d===0?"。左に動かすと、抑えた場合を試せます":d>0?" → 約"+man(d)+"万 抑える想定（貯金に回せる額が増えます）":" → ペースより約"+man(-d)+"万 多く使う想定");}}
function render(){
  var mo=+YM.slice(5);$("ttl").textContent=mo+"月の予報";
  $("sync").textContent=SYNC_ERR||(S.feedAt?"メール取り込み："+new Date(S.feedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"");
  var c=calc(YM);
  if(c.an&&!SYNC_ERR)$("sync").textContent+=($("sync").textContent?" ・ ":"")+"残高入力 "+mo+"/"+c.an.day;
  $("ask-start").hidden=c.start!=null;$("ask-month").textContent=mo;
  if(c.start==null){["avail","end","next"].forEach(function(id){$(id).innerHTML='—<small>万円</small>';});
    $("avail-note").textContent="月初の残高を入れると計算します";$("big-tile").hidden=true;$("flow").innerHTML="";return;}
  var av=c.minSafe-S.target;
  $("hero").className="hero"+(av<0?" bad":"");
  $("avail").innerHTML=man(Math.max(0,av))+"<small>万円</small>";
  var pend=c.pending>0?"入金待ちの精算など +"+man(c.pending)+"万 は数えていません。":"";
  $("avail-note").textContent=av<0
    ?"残したい額 "+m0(S.target)+"万まで、あと"+man(-av)+"万足りません。"+(pend?pend+(av+c.pending>=0?"入金されれば足ります。":"入金されても、あと"+man(-(av+c.pending))+"万足りません。"):"")
    :"残したい額 "+m0(S.target)+"万を守れます"+(c.pending>0?"（精算が入ったら +"+man(c.pending)+"万）":"");
  $("end").innerHTML=man(c.end)+"<small>万円</small>";
  var diff=c.end-S.target;$("end-bar").className="bar"+(diff<0?" bad":"");
  $("end-fill").style.width=Math.max(4,Math.min(100,c.end/(S.target*1.6)*100))+"%";
  $("end-note").textContent="残したい額 "+m0(S.target)+"万 "+(diff<0?"− ":"＋ ")+man(Math.abs(diff))+"万";
  var mcap=S.months[YM].cap,nx=nextEnd(mcap!=null?mcap:null),nm=S.months[YM].memos.filter(function(x){return x.kind==="card";}).length;
  $("next").innerHTML=(nx==null?"—":"約"+Math.round(nx.est/10000))+"<small>万円</small>";
  var asof=S.feedAt?(function(d){return(d.getMonth()+1)+"/"+d.getDate();})(new Date(S.feedAt)):"";
  var row=function(a,b,c,cls){return '<div class="dr'+(cls?" "+cls:"")+'"><span>'+a+'</span><span class="num '+(c||"")+'">'+b+'</span></div>';};
  var h2="";
  if(nx){var lo=Math.round(nx.lo/10000),hi=Math.round(nx.hi/10000);
    $("next-sum").textContent=(hi>lo?"ふれ幅 "+lo+"〜"+hi+"万 ・ ":"")+"内訳とカードの支出";
    h2+=row("今月末の見込み",man(nx.end)+"万");
    nx.parts.forEach(function(x){h2+=row("来月　"+esc(x.name),sman(x.amt),x.amt<0?"minus":"plus");
      if(x.key==="card1"||x.key==="card2"){var p=projUsage(x.key,YM);
        if(p&&p.est!=null)h2+='<div class="ds">今月ここまでのカード利用 <b>'+man(p.done)+'万</b>'+(asof?'（'+asof+'時点）':'')+' → 月末までに約'+man(p.est)+'万'+(p.avg!=null?'（過去'+p.n+'か月の平均 '+man(p.avg)+'万）':'')+'</div>';}});
    h2+=row("来月末の見込み","約"+Math.round(nx.est/10000)+"万","","tot");
    if(mcap!=null)h2+='<div class="ds">※「カード利用を'+man(mcap)+'万に抑える」設定で計算しています</div>';
    h2+='<div class="ds">カードは「今月ここまでのペース」と「過去の月の平均」を、日がたつほどペース寄りに混ぜて予測。精算・給料は過去の入金から、家賃などは毎月の予定から。'+(nm?'支出メモ '+nm+'件。':'')+'</div>';}
  $("next-note").innerHTML=h2;
  renderSave(mcap);
  var big=c.ev.filter(function(e){return e.day>=TODAY&&e.st!=="done"&&Math.abs(e.amt)>=50000;})[0];
  $("big-tile").hidden=!big;
  if(big){$("big-name").textContent=mo+"/"+big.day+" "+big.name;$("big-amt").textContent=sman(big.amt);
    $("big-amt").className="num "+(big.amt<0?"minus":"plus");
    $("big-note").textContent="このあと残高は "+man(big.after)+"万"+(c.low===big?"（今月いちばん少ない）":"");}
  $("btn-flow").textContent=($("flow").hidden?"▼":"▲")+" 今月の流れを見る（"+c.ev.length+"件）";
  var h='<div class="it"><span class="d">'+mo+'/1</span><span class="n">月初の残高</span><span class="b num">'+man(c.start)+'万</span></div>';
  var anRow=c.an?'<div class="it"><span class="d">'+mo+'/'+c.an.day+'</span><span class="n"><b>今日の残高（入力）</b></span><span class="b num">'+man(c.an.bal)+'万</span></div>':"",anShown=false;
  c.ev.forEach(function(e,ix){if(c.an&&!anShown&&e.day>c.an.day){h+=anRow;anShown=true;}h+='<div class="it'+(e===c.low?" low":"")+(e.day<TODAY&&e.st==="done"?" past":"")+'" data-ix="'+ix+'">'+
    '<span class="d">'+mo+'/'+e.day+'</span><span class="n">'+esc(e.name)+tag(e)+'</span>'+
    '<span class="a num '+(e.amt<0?"minus":"plus")+'">'+sman(e.amt)+'</span><span class="b num">'+(e.after==null?"":man(e.after)+"万")+'</span></div>';});
  if(c.an&&!anShown)h+=anRow;
  var um=unmatched();if(um.length){h+='<div class="sec">メールで見つかった、予定にない入出金</div>';
    um.forEach(function(mv,k){h+='<div class="it"><span class="d">'+mo+'/'+(+mv.date.slice(8,10))+'</span><span class="n">'+(mv.dir>0?"入金":"出金")+'</span><span class="a num '+(mv.dir<0?"minus":"plus")+'">'+sman(mv.dir*mv.amount)+'</span><button class="chk" data-um="'+k+'">追加</button></div>';});}
  var cm=S.months[YM].memos.filter(function(x){return x.kind==="card";});
  if(cm.length){h+='<div class="sec">カードの支出メモ（来月の引き落としに反映）</div>';
    cm.forEach(function(x){h+='<div class="it"><span class="d">'+mo+'/'+x.day+'</span><span class="n">'+esc(x.name)+'</span><span class="a num minus">'+sman(-x.amt)+'</span><button class="chk" data-delmemo="'+x.id+'">削除</button></div>';});}
  $("flow").innerHTML=h;
  $("flow").querySelectorAll("[data-ix]").forEach(function(el){el.onclick=function(){openEdit(c.ev[+el.dataset.ix]);};});
  $("flow").querySelectorAll("[data-um]").forEach(function(el){el.onclick=function(ev){ev.stopPropagation();var mv=um[+el.dataset.um];
    S.months[YM].items.push({id:uid(),key:"",name:mv.dir>0?"その他の入金":"その他の出金",day:+mv.date.slice(8,10),amt:mv.dir*mv.amount,st:"done"});
    S.used[mv.id]=1;save();render();};});
  $("flow").querySelectorAll("[data-delmemo]").forEach(function(el){el.onclick=function(){var m=S.months[YM];
    m.memos=m.memos.filter(function(x){return x.id!==el.dataset.delmemo;});save();render();};});
}

/* ---------- 操作 ---------- */
$("in-start").addEventListener("change",function(){var v=parseInt(this.value,10);if(isNaN(v))return;ensure(YM).start=v;save();render();});
$("cap-range").addEventListener("input",function(){S.months[YM].cap=parseInt(this.value,10);save();render();});
$("cap-reset").onclick=function(){S.months[YM].cap=null;save();render();};
$("btn-flow").onclick=function(){$("flow").hidden=!$("flow").hidden;render();};
$("btn-add").onclick=function(){$("a-name").value="";$("a-amt").value="";$("a-day").value=TODAY;$("dlg-add").showModal();};
$("a-cancel").onclick=function(){$("dlg-add").close();};
$("a-ok").onclick=function(){var amt=Math.abs(parseInt($("a-amt").value,10)),day=parseInt($("a-day").value,10);
  if(!amt||!day){alert("日と金額を入れてください");return;}
  ensure(YM).memos.push({id:uid(),kind:$("a-kind").value,name:$("a-name").value||"支出メモ",day:Math.min(31,Math.max(1,day)),amt:amt});
  save();$("dlg-add").close();render();};
var editing=null;
function openEdit(e){editing=e;$("e-ttl").textContent=e.name;$("e-day").value=e.day;$("e-amt").value=e.amt;
  $("e-st").value=e.st;$("e-st").disabled=e.type==="memo";$("dlg-edit").showModal();}
$("e-cancel").onclick=function(){$("dlg-edit").close();};
$("e-ok").onclick=function(){var r=editing.ref,amt=parseInt($("e-amt").value,10),day=parseInt($("e-day").value,10);
  if(isNaN(amt)||!day)return;r.day=day;
  if(editing.type==="memo"){r.amt=Math.abs(amt);r.kind=amt<0?"out":"in";}else{if(r.amt!==amt)r.manual=true;r.amt=amt;r.st=$("e-st").value;}
  save();$("dlg-edit").close();render();};
$("e-del").onclick=function(){if(!confirm("「"+editing.name+"」を今月から消しますか？"))return;var m=S.months[YM];
  m.items=m.items.filter(function(i){return i!==editing.ref;});m.memos=m.memos.filter(function(x){return x!==editing.ref;});
  save();$("dlg-edit").close();render();};

function tplRow(t){return '<div class="tpl"><input value="'+esc(t.name)+'"><input type="number" inputmode="numeric" value="'+t.day+'"><input type="number" inputmode="numeric" value="'+t.amt+'"><input type="checkbox" '+(t.unsure?"checked":"")+'></div>';}
$("btn-set").onclick=function(){var an=ensure(YM).anchor;$("s-bal").value=an?an.bal:"";$("s-bal-note").textContent=an?"入力した日："+(+YM.slice(5))+"/"+an.day+"（空にして保存すると、月初の残高からの計算に戻ります）":"";
  $("s-target").value=S.target;$("s-start").value=ensure(YM).start==null?"":S.months[YM].start;
  $("s-tpl").innerHTML=S.tpl.map(tplRow).join("");$("s-gas").value=S.gas;$("s-token").value=S.token;$("dlg-set").showModal();};
$("s-cancel").onclick=function(){$("dlg-set").close();};
$("s-ok").onclick=function(){S.target=parseInt($("s-target").value,10)||0;
  var st=$("s-start").value;S.months[YM].start=st===""?null:parseInt(st,10);
  var bv=$("s-bal").value,oa=S.months[YM].anchor;
  if(bv==="")delete S.months[YM].anchor;else if(!oa||String(oa.bal)!==bv)S.months[YM].anchor={day:TODAY,bal:parseInt(bv,10)};   /* 値を変えたときだけ、今日の日付で入れ直す */
  var rows=$("s-tpl").querySelectorAll(".tpl");S.tpl=S.tpl.map(function(t,i){var f=rows[i].querySelectorAll("input");
    return Object.assign({},t,{name:f[0].value,day:parseInt(f[1].value,10)||t.day,amt:parseInt(f[2].value,10)||0,unsure:f[3].checked});});
  S.gas=$("s-gas").value.trim();S.token=$("s-token").value.trim();save();$("dlg-set").close();render();sync();};
$("s-sync").onclick=function(){S.gas=$("s-gas").value.trim();S.token=$("s-token").value.trim();save();sync();};
$("s-backup").onclick=function(){var t=JSON.stringify(S);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert("コピーしました。メモ帳などに貼って保存してください。");},function(){prompt("これをコピーして保存してください",t);});};

ensure(YM);save();render();sync();
})();
</script>
</body>
</html>
